# SonarQube Cloud settings for assignments-service.
#
# The CI job (.github/workflows/ci.yml, "assignments") reads these values and
# passes them to the SonarScanner for .NET, which is the scanner C# needs; it
# doesn't read this file itself. Keeping the settings here, in one reviewed
# file, means changing what Sonar checks is a pull request like any other.
#
# To turn analysis on: create the project in SonarQube Cloud, set the two keys
# below to match it, and add a SONAR_TOKEN repository secret. Without the
# secret the CI step is skipped.

sonar.projectKey=your-org_company-app-assignments
sonar.organization=your-org
sonar.host.url=https://sonarcloud.io
sonar.projectName=Company app: assignments-service

# Generated or test-only code doesn't count toward quality gates.
sonar.exclusions=**/Migrations/**,**/bin/**,**/obj/**

# Coverage comes from the coverlet run in CI (OpenCover format). coverlet names
# the file coverage.opencover.<id>.xml inside assignments-service/TestResults/.
sonar.cs.opencover.reportsPaths=assignments-service/TestResults/coverage.opencover.*.xml
