# The frontend proxy gives the whole app one origin: http://localhost:8080.
# The browser only ever talks to this proxy, so there are no CORS problems,
# and each service keeps its own /api/<name> path.
worker_processes auto;
pid /tmp/nginx.pid;

events {}

http {
  # Temp paths in /tmp so nginx can run as a non-root user.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  # Docker's embedded DNS. Using variables in proxy_pass makes nginx resolve
  # upstreams per request instead of at startup, so a service that doesn't
  # exist yet (assignments-service, until you build it) returns 502 instead of
  # stopping the proxy from starting.
  resolver 127.0.0.11 valid=10s ipv6=off;

  proxy_set_header Host              $http_host;  # keeps the port, so Location headers point back at localhost:8080
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_http_version 1.1;

  server {
    listen 8080;

    location /api/employees {
      set $upstream http://employees-service:8080;
      proxy_pass $upstream;
    }
    location /api/projects {
      set $upstream http://projects-service:8000;
      proxy_pass $upstream;
    }
    location /api/assignments {
      set $upstream http://assignments-service:8080;
      proxy_pass $upstream;
    }
    location /api/notifications {
      set $upstream http://notifications-service:8080;
      proxy_pass $upstream;
    }

    # Browser telemetry: /otlp/v1/traces -> otel-lgtm:4318/v1/traces
    location /otlp/ {
      set $upstream http://otel-lgtm:4318;
      rewrite ^/otlp/(.*)$ /$1 break;
      proxy_pass $upstream;
    }

    location / {
      set $upstream http://web:8080;
      proxy_pass $upstream;
    }
  }
}
