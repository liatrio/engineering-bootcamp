# Serves the built SPA. /api and /otlp never reach this container: the frontend-proxy routes
# them to the services and to otel-lgtm before they get here.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed build assets never change, so cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths (e.g. /employees/new on refresh) get index.html, and the
    # client-side router takes over. index.html itself is never cached.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
