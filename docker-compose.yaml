version: '3'
services:
  docsify:
    build: .
    ports:
     - "3000:3000"
    # Mount only the content so edits show up live. Mounting the whole repo
    # would hide the dist/ built into the image behind the host's (maybe
    # missing) dist/. Changes under src/*.ts need an image rebuild.
    volumes:
     - "./docs:/usr/local/docsify/docs"
     - "./src/quizzes:/usr/local/docsify/src/quizzes"
     - "./css:/usr/local/docsify/css"
     - "./img:/usr/local/docsify/img"
