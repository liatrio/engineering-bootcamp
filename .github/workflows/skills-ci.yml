name: skills-ci
on:
  pull_request:
    # No `branches` filter: a `*` pattern skips branch names containing `/`,
    # which would skip stacked PRs.
    paths:
      - '.agents/**'
      - '.github/workflows/skills-ci.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'biome.json'
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      # Each step runs even if an earlier one fails, so one run reports every problem.
      - name: Lint and typecheck skill scripts
        run: npm run lint:agents
      - name: Test skill scripts
        if: ${{ !cancelled() }}
        run: npm run test:agents
