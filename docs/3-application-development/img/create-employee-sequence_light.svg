<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 766" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Sequence of Create Employee: the browser posts to the proxy, which forwards to EmployeesController; the controller validates the request and calls EmployeeService, which checks the email through EmployeeStore and PostgreSQL, inserts the row, publishes employee.created to RabbitMQ after the commit, and returns 201 Created. Asynchronously, RabbitMQ delivers the event to notifications-service, which stores it; the web app polls GET /api/notifications."><title>Sequence of Create Employee: the browser posts to the proxy, which forwards to EmployeesController; the controller validates the request and calls EmployeeService, which checks the email through EmployeeStore and PostgreSQL, inserts the row, publishes employee.created to RabbitMQ after the commit, and returns 201 Created. Asynchronously, RabbitMQ delivers the event to notifications-service, which stores it; the web app polls GET /api/notifications.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#444444"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#444444" stroke-width="1.5"/></marker></defs><rect x="260" y="8" width="390" height="752" rx="10" fill="#f6fbf3" stroke="#8a8a8a" stroke-width="1.6"/><text x="455" y="26" font-size="12" text-anchor="middle" fill="#555555" font-weight="bold">employees-service (.NET)</text><rect x="7" y="34" width="116" height="44" rx="6" fill="#f1f1f1" stroke="#8a8a8a" stroke-width="1.6"/><text x="65" y="52" font-size="12" text-anchor="middle" fill="#262626" font-weight="bold">web</text><text x="65" y="68" font-size="11" text-anchor="middle" fill="#555555">(browser)</text><line x1="65" y1="78" x2="65" y2="754" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/><rect x="132" y="34" width="116" height="44" rx="6" fill="#f1f1f1" stroke="#8a8a8a" stroke-width="1.6"/><text x="190" y="52" font-size="12" text-anchor="middle" fill="#262626" font-weight="bold">frontend-</text><text x="190" y="68" font-size="11" text-anchor="middle" fill="#555555">proxy</text><line x1="190" y1="78" x2="190" y2="754" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/><rect x="267" y="34" width="116" height="44" rx="6" fill="#eaf7e6" stroke="#24ae1d" stroke-width="1.6"/><text x="325" y="52" font-size="12" text-anchor="middle" fill="#262626" font-weight="bold">Employees</text><text x="325" y="68" font-size="11" text-anchor="middle" fill="#555555">Controller</text><line x1="325" y1="78" x2="325" y2="754" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/><rect x="397" y="34" width="116" height="44" rx="6" fill="#eaf7e6" stroke="#24ae1d" stroke-width="1.6"/><text x="455" y="52" font-size="12" text-anchor="middle" fill="#262626" font-weight="bold">Employee</text><text x="455" y="68" font-size="11" text-anchor="middle" fill="#555555">Service</text><line x1="455" y1="78" x2="455" y2="754" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/><rect x="527" y="34" width="116" height="44" rx="6" fill="#eaf7e6" stroke="#24ae1d" stroke-width="1.6"/><text x="585" y="52" font-size="12" text-anchor="middle" fill="#262626" font-weight="bold">EmployeeStore</text><text x="585" y="68" font-size="11" text-anchor="middle" fill="#555555">(EF Core)</text><line x1="585" y1="78" x2="585" y2="754" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/><rect x="657" y="34" width="116" height="44" rx="6" fill="#f1f1f1" stroke="#8a8a8a" stroke-width="1.6"/><text x="715" y="52" font-size="12" text-anchor="middle" fill="#262626" font-weight="bold">PostgreSQL</text><text x="715" y="68" font-size="11" text-anchor="middle" fill="#555555">employees db</text><line x1="715" y1="78" x2="715" y2="754" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/><rect x="787" y="34" width="116" height="44" rx="6" fill="#f1f1f1" stroke="#8a8a8a" stroke-width="1.6"/><text x="845" y="52" font-size="12" text-anchor="middle" fill="#262626" font-weight="bold">RabbitMQ</text><text x="845" y="68" font-size="11" text-anchor="middle" fill="#555555">company.events</text><line x1="845" y1="78" x2="845" y2="754" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/><rect x="907" y="34" width="116" height="44" rx="6" fill="#f1f1f1" stroke="#8a8a8a" stroke-width="1.6"/><text x="965" y="52" font-size="12" text-anchor="middle" fill="#262626" font-weight="bold">notifications-</text><text x="965" y="68" font-size="11" text-anchor="middle" fill="#555555">service (Go)</text><line x1="965" y1="78" x2="965" y2="754" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/><line x1="65" y1="110" x2="184" y2="110" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/><text x="127.5" y="104" font-size="11.5" text-anchor="middle" fill="#262626">1. POST /api/employees</text><line x1="190" y1="148" x2="319" y2="148" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/><text x="257.5" y="142" font-size="11.5" text-anchor="middle" fill="#262626">2. POST /api/employees (path unchanged)</text><path d="M325,178 h28 v18 h-24" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/><text x="359" y="190" font-size="11.5" text-anchor="start" fill="#262626">3. [ApiController] validates EmployeeRequest (400 if not)</text><line x1="325" y1="226" x2="449" y2="226" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/><text x="390.0" y="220" font-size="11.5" text-anchor="middle" fill="#262626">4. CreateAsync(request)</text><line x1="455" y1="264" x2="579" y2="264" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/><text x="520.0" y="258" font-size="11.5" text-anchor="middle" fill="#262626">5. EmailInUseAsync(email)</text><line x1="585" y1="302" x2="709" y2="302" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/><text x="650.0" y="296" font-size="11.5" text-anchor="middle" fill="#262626">6. SELECT … WHERE NormalizedEmail = $1</text><line x1="715" y1="340" x2="591" y2="340" stroke="#444444" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="650.0" y="334" font-size="11.5" text-anchor="middle" fill="#262626">no rows</text><line x1="455" y1="378" x2="579" y2="378" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/><text x="520.0" y="372" font-size="11.5" text-anchor="middle" fill="#262626">7. AddAsync(employee)</text><line x1="585" y1="416" x2="709" y2="416" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/><text x="650.0" y="410" font-size="11.5" text-anchor="middle" fill="#262626">8. INSERT … ; COMMIT</text><line x1="455" y1="454" x2="839" y2="454" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/><text x="650.0" y="448" font-size="11.5" text-anchor="middle" fill="#262626">9. publish employee.created (after the commit)</text><line x1="455" y1="492" x2="331" y2="492" stroke="#444444" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="390.0" y="486" font-size="11.5" text-anchor="middle" fill="#262626">10. EmployeeResponse</text><line x1="325" y1="530" x2="71" y2="530" stroke="#444444" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="195.0" y="524" font-size="11.5" text-anchor="middle" fill="#262626">11. 201 Created, Location: /api/employees/{id}</text><line x1="10" y1="562" x2="1020" y2="562" stroke="#24ae1d" stroke-width="1.2" stroke-dasharray="8 5"/><text x="14" y="578" font-size="11.5" text-anchor="start" fill="#24ae1d" font-weight="bold">Asynchronous: after the user already has their answer</text><line x1="845" y1="602" x2="959" y2="602" stroke="#444444" stroke-width="1.5" marker-end="url(#ao)"/><text x="905.0" y="596" font-size="11.5" text-anchor="middle" fill="#262626">12. deliver from queue notifications</text><path d="M965,632 h-28 v18 h24" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/><text x="931" y="644" font-size="11.5" text-anchor="end" fill="#262626">13. store the notification, then ack</text><line x1="65" y1="680" x2="184" y2="680" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/><text x="127.5" y="674" font-size="11.5" text-anchor="middle" fill="#262626">14. GET /api/notifications (polled every 5 s)</text><line x1="190" y1="718" x2="959" y2="718" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/><text x="577.5" y="712" font-size="11.5" text-anchor="middle" fill="#262626">15. GET /api/notifications → newest first</text></svg>
