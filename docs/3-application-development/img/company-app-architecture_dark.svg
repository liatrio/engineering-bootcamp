<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Company app architecture: the browser talks only to the frontend-proxy, which routes to web and four backend services. Employees, projects, and assignments each own a database on one PostgreSQL server. Employees publishes events to RabbitMQ; notifications consumes every event; assignments calls employees and projects over HTTP, publishes assignment.created, and consumes employee.deleted. flagd and otel-lgtm support every service."><title>Company app architecture: the browser talks only to the frontend-proxy, which routes to web and four backend services. Employees, projects, and assignments each own a database on one PostgreSQL server. Employees publishes events to RabbitMQ; notifications consumes every event; assignments calls employees and projects over HTTP, publishes assignment.created, and consumes employee.deleted. flagd and otel-lgtm support every service.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d0d0d0"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#d0d0d0" stroke-width="1.5"/></marker></defs><rect x="400" y="16" width="160" height="40" rx="8" fill="#2b2b2b" stroke="#9a9a9a" stroke-width="1.6"/><text x="480" y="41" font-size="14" text-anchor="middle" fill="#f8f8f8" font-weight="bold">Browser</text><line x1="480" y1="56" x2="480" y2="82" stroke="#d0d0d0" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="84" width="900" height="40" rx="8" fill="#2b2b2b" stroke="#9a9a9a" stroke-width="1.6"/><text x="480" y="109" font-size="13" text-anchor="middle" fill="#f8f8f8" font-weight="bold">frontend-proxy (nginx) · localhost:8080 · / → web, /api/&lt;name&gt; → that service</text><line x1="110" y1="124" x2="110" y2="168" stroke="#d0d0d0" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="170" width="160" height="64" rx="8" fill="#18331a" stroke="#89df00" stroke-width="1.6"/><text x="110" y="197" font-size="13" text-anchor="middle" fill="#f8f8f8" font-weight="bold">web</text><text x="110" y="218" font-size="12" text-anchor="middle" fill="#c8c8c8">React + TypeScript</text><line x1="295" y1="124" x2="295" y2="168" stroke="#d0d0d0" stroke-width="1.5" marker-end="url(#a)"/><rect x="215" y="170" width="160" height="64" rx="8" fill="#18331a" stroke="#89df00" stroke-width="1.6"/><text x="295" y="197" font-size="13" text-anchor="middle" fill="#f8f8f8" font-weight="bold">employees-service</text><text x="295" y="218" font-size="12" text-anchor="middle" fill="#c8c8c8">.NET 10</text><line x1="480" y1="124" x2="480" y2="168" stroke="#d0d0d0" stroke-width="1.5" marker-end="url(#a)"/><rect x="400" y="170" width="160" height="64" rx="8" fill="#18331a" stroke="#89df00" stroke-width="1.6"/><text x="480" y="197" font-size="13" text-anchor="middle" fill="#f8f8f8" font-weight="bold">projects-service</text><text x="480" y="218" font-size="12" text-anchor="middle" fill="#c8c8c8">Python · FastAPI</text><line x1="665" y1="124" x2="665" y2="168" stroke="#d0d0d0" stroke-width="1.5" marker-end="url(#a)"/><rect x="585" y="170" width="160" height="64" rx="8" fill="none" stroke="#89df00" stroke-width="1.6" stroke-dasharray="7 5"/><text x="665" y="197" font-size="13" text-anchor="middle" fill="#f8f8f8" font-weight="bold">assignments-service</text><text x="665" y="218" font-size="12" text-anchor="middle" fill="#c8c8c8">.NET 10 · your team builds it</text><line x1="850" y1="124" x2="850" y2="168" stroke="#d0d0d0" stroke-width="1.5" marker-end="url(#a)"/><rect x="770" y="170" width="160" height="64" rx="8" fill="#18331a" stroke="#89df00" stroke-width="1.6"/><text x="850" y="197" font-size="13" text-anchor="middle" fill="#f8f8f8" font-weight="bold">notifications-service</text><text x="850" y="218" font-size="12" text-anchor="middle" fill="#c8c8c8">Go</text><path d="M640,234 C640,292 320,292 320,236" fill="none" stroke="#d0d0d0" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/><path d="M660,234 C660,266 505,266 505,236" fill="none" stroke="#d0d0d0" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="480" y="299" font-size="11" text-anchor="middle" fill="#c8c8c8" font-style="italic">HTTP: does this employee / project exist?</text><rect x="245" y="308" width="480" height="80" rx="8" fill="#2b2b2b" stroke="#9a9a9a" stroke-width="1.6"/><text x="485" y="380" font-size="11" text-anchor="middle" fill="#f8f8f8" font-weight="bold">PostgreSQL: one server, one database per service</text><rect x="245" y="318" width="100" height="38" rx="6" fill="#18331a" stroke="#89df00" stroke-width="1.6"/><text x="295" y="342" font-size="12" text-anchor="middle" fill="#f8f8f8">employees</text><rect x="430" y="318" width="100" height="38" rx="6" fill="#18331a" stroke="#89df00" stroke-width="1.6"/><text x="480" y="342" font-size="12" text-anchor="middle" fill="#f8f8f8">projects</text><rect x="615" y="318" width="100" height="38" rx="6" fill="none" stroke="#89df00" stroke-width="1.6" stroke-dasharray="7 5"/><text x="665" y="342" font-size="12" text-anchor="middle" fill="#f8f8f8">assignments</text><line x1="295" y1="234" x2="295" y2="316" stroke="#d0d0d0" stroke-width="1.5" marker-end="url(#a)"/><line x1="480" y1="234" x2="480" y2="316" stroke="#d0d0d0" stroke-width="1.5" marker-end="url(#a)"/><line x1="665" y1="234" x2="665" y2="316" stroke="#d0d0d0" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/><rect x="30" y="420" width="900" height="40" rx="8" fill="#2b2b2b" stroke="#9a9a9a" stroke-width="1.6"/><text x="480" y="445" font-size="13" text-anchor="middle" fill="#f8f8f8" font-weight="bold">RabbitMQ · company.events (topic exchange)</text><line x1="225" y1="234" x2="225" y2="418" stroke="#d0d0d0" stroke-width="1.5" marker-end="url(#a)"/><text x="218" y="400" font-size="11" text-anchor="end" fill="#c8c8c8">pub: employee.*</text><line x1="738" y1="234" x2="738" y2="418" stroke="#d0d0d0" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/><line x1="738" y1="418" x2="738" y2="236" stroke="#d0d0d0" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="746" y="392" font-size="11" text-anchor="start" fill="#c8c8c8">pub: assignment.created</text><text x="746" y="407" font-size="11" text-anchor="start" fill="#c8c8c8">sub: employee.deleted</text><line x1="915" y1="420" x2="915" y2="236" stroke="#d0d0d0" stroke-width="1.5" marker-end="url(#a)"/><text x="908" y="300" font-size="11" text-anchor="end" fill="#c8c8c8">sub: every event</text><rect x="30" y="490" width="330" height="48" rx="8" fill="#2b2b2b" stroke="#9a9a9a" stroke-width="1.6"/><text x="195" y="511" font-size="13" text-anchor="middle" fill="#f8f8f8" font-weight="bold">flagd</text><text x="195" y="528" font-size="11" text-anchor="middle" fill="#c8c8c8">feature flags (projects now, assignments in 3.6)</text><rect x="380" y="490" width="550" height="48" rx="8" fill="#2b2b2b" stroke="#9a9a9a" stroke-width="1.6"/><text x="655" y="511" font-size="13" text-anchor="middle" fill="#f8f8f8" font-weight="bold">otel-lgtm (Grafana on localhost:3001)</text><text x="655" y="528" font-size="11" text-anchor="middle" fill="#c8c8c8">every service sends logs, metrics, and traces over OTLP</text><text x="480" y="566" font-size="12" text-anchor="middle" fill="#c8c8c8">Solid: in the starter.   Dashed: assignments-service and what it adds, built by your team.</text></svg>
