<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 670" role="img" aria-label="A grid. Eight horizontal bands are the employees-service foundation, built once: routing, auth, validation, error handling, data access, observability, testing, and conventions, each labelled with the foundation piece that implements it. Two vertical columns cut through every band. The solid Employees column shows the one small thing the Employees feature wrote for each band, such as a controller, a request type with data annotations, a thrown ConflictException, a DbSet, one counter, and its tests. The dashed Departments column, which you sketch in the Practice step, has the same eight cells with the same shape."><title>A grid. Eight horizontal bands are the employees-service foundation, built once: routing, auth, validation, error handling, data access, observability, testing, and conventions, each labelled with the foundation piece that implements it. Two vertical columns cut through every band. The solid Employees column shows the one small thing the Employees feature wrote for each band, such as a controller, a request type with data annotations, a thrown ConflictException, a DbSet, one counter, and its tests. The dashed Departments column, which you sketch in the Practice step, has the same eight cells with the same shape.</title>
